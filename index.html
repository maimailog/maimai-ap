<script>(()=>{
 const status=document.querySelector('#save-status'),main=document.querySelector('#main');
 let reported=false;
 function report(detail){
  if(reported||main.children.length)return;
  reported=true;status.textContent='起動の確認が必要です';
  const box=document.createElement('section');box.className='panel';
  const title=document.createElement('h2');title.textContent='起動できない原因が見つかりました';
  const text=document.createElement('p');text.textContent='保存データは削除していません。下のメッセージをそのまま教えてください。';
  const code=document.createElement('pre');code.style.whiteSpace='pre-wrap';code.textContent=String(detail);
  box.append(title,text,code);main.replaceChildren(box);
 }
 window.addEventListener('error',e=>report(e.message));
 window.addEventListener('unhandledrejection',e=>report(e.reason?.message||e.reason));
 document.addEventListener('securitypolicyviolation',e=>report('安全確認で停止：'+e.violatedDirective+' / '+e.blockedURI));
 setTimeout(()=>report('起動待機が15秒を超えました。保存機能の応答、またはスクリプトの実行を確認する必要があります。'),15000);
})();

async function readXlsx(buffer) {
  const zip=await JSZip.loadAsync(buffer);

function decodeText(buffer,encoding='auto'){

  if(bytes[0]===0xfe&&bytes[1]===0xff)return new TextDecoder('utf-16be',{fatal:true}).decode(bytes);

}

    return p.review_count?3:2;
  };
  let ordered=shuffleReading(candidates,random);
  if(mode==='all')ordered.sort((a,b)=>rank(a)-rank(b)||(progressFor(state,a.card_id).last_reviewed_at||'').localeCompare(progressFor(state,b.card_id).last_reviewed_at||''));
  return {id:crypto.randomUUID(),mode,queue:ordered.map(c=>c.card_id),index:0,repeated:[],wrong:[],initial:ordered.length,created_at:new Date(now).toISOString(),reading:null};
}
function openReading(state,random=Math.random){
  const next=upgradeState(state),s=next.session;
  if(!s||s.index>=s.queue.length)throw Error('出題中の単語がありません。');
  if(s.reading)return next;
  const card=next.cards.find(c=>c.card_id===s.queue[s.index]);
  if(!card)throw Error('この単語は削除されています。');
  const {choices,reason}=buildChoices(next.cards,card,random);
  s.reading={card_id:card.card_id,snapshot:Object.fromEntries(FIELDS.map(k=>[k,card[k]])),phase:'options',choices,reason};
  return next;
}
function submitReading(state,selectedId=null,now=new Date()){
  const next=upgradeState(state),s=next.session,r=s?.reading;
  if(!r||r.phase!=='options')throw Error('この単語は回答済みか、まだ解説を開いていません。');
  if(selectedId!==null&&!r.choices.some(c=>c.card_id===selectedId))throw Error('表示されていない選択肢です。');
  const review_id=`${s.id}:${s.index}`;
  if(next.history.some(h=>h.review_id===review_id))throw Error('この回答は保存済みです。');
  const rating=selectedId===null?'read':selectedId===r.card_id?'choice_correct':'choice_incorrect';
  const stamp=new Date(now).toISOString(),p={...progressFor(next,r.card_id)};
  p.review_count++;p.correct_count+=rating==='choice_correct'?1:0;
  // Keep legacy mastery stages as history, but never increase them from this light exercise.
  p.last_rating=rating;p.last_reviewed_at=stamp;p.next_review_at=plusDays(dayJST(now),rating==='choice_incorrect'?1:3);
  next.progress[r.card_id]=p;
  next.history.push({review_id,card_id:r.card_id,mode:'reading_v2',rating,reviewed_at:stamp,next_review_at:p.next_review_at,selected_card_id:selectedId});
  r.phase='result';r.rating=rating;r.selected_id=selectedId;
  return next; // Deliberately do not advance until the reader presses Next.
}
function nextReading(state){
  const next=upgradeState(state),s=next.session;
  if(!s?.reading||s.reading.phase!=='result')throw Error('解説を確認してから次の単語へ進んでください。');
  s.index++;s.reading=null;
  if(s.mode==='starred'){
    // Finish the current explanation; remove unstarred cards from the remaining queue.
    s.queue=[...s.queue.slice(0,s.index),...s.queue.slice(s.index).filter(id=>isStarred(next,id))];
  }
  return next;
}

function planCount(){if(!importData?.plan)return '';return ['add','update','skip'].map((a,i)=>`${['追加','更新','スキップ'][i]} ${importData.plan.filter(p=>p.action===a).length}枚`).join(' / ');}
function selectSheet(index){
 importData.index=index;
 try{importData.prepared=prepareRows(importData.sheets[index].rows);importData.plan=makePlan(importData.prepared,state);importData.error=null;importData.revision=state.revision;}
 catch(e){importData.error=e.message;importData.plan=[];}
}
async function loadImport(file,encoding='auto'){
 try{
  setStatus('ファイルを確認中…');
  const sheets=await readFile(file,encoding);
  importData={source:file.name,sheets,index:Math.max(0,sheets.findIndex(s=>s.name==='単語帳'))};
  selectSheet(importData.index);restoreData=null;location.hash='data';view='data';render();setStatus('プレビュー・まだ取り込んでいません');
  $('#import-preview').scrollIntoView({block:'start'});
 }catch(e){setStatus('ファイルを読み込めませんでした',true);notify(e.message,true);}
}
function render(){
 view=['home','study','cards','data'].includes(location.hash.slice(1))?location.hash.slice(1):'home';
 document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===view);a.setAttribute('aria-current',a.dataset.nav===view?'page':'false');});
 $('#main').innerHTML=({home,study,cards,data})[view]();
}
function openEditor(id){
 const c=state.cards.find(c=>c.card_id===id),p=c?progressFor(state,id):null;
 const history=c?state.history.filter(h=>h.card_id===id).slice().reverse():[];
 const dialog=$('#modal');
 dialog.innerHTML=`<div class="dialog-top"><h2>${c?'単語の編集・学習履歴':'単語を追加'}</h2><button data-action="close-modal" aria-label="閉じる">×</button></div><form id="edit-form" data-id="${c?.card_id||''}"><div class="fields">${FIELDS.map((k,i)=>`<label class="${['cue_text','description'].includes(k)?'span2':''}">${HEADERS[i]}${['cue_text','keyword'].includes(k)?'（必須）':''}${['cue_text','description','keyword'].includes(k)?`<textarea name="${k}" rows="${k==='description'?4:2}" maxlength="20000" ${['cue_text','keyword'].includes(k)?'required':''}>${html(c?.[k]||'')}</textarea>`:`<input name="${k}" value="${html(c?.[k]||'')}" maxlength="20000">`}</label>`).join('')}</div><div class="actions"><button class="primary" type="submit">保存する</button>${c?`<button type="button" class="danger" data-action="delete" data-id="${c.card_id}">削除</button>`:''}<button type="button" data-action="close-modal">キャンセル</button></div></form>${c?`<div class="history"><h3>学習履歴 ${p.review_count}回</h3><p>次回復習：${p.next_review_at||'未学習'} / ${statusOf(p)}</p>${history.map(h=>`<p>${formatTime(h.reviewed_at)}　<strong>${RATINGS[h.rating]}</strong>　→ ${html(h.next_review_at)}</p>`).join('')}</div>`:''}`;
 dialog.showModal();
}
const actions={
 navigate:async b=>{location.hash=b.dataset.to;},
 begin:async()=>beginReading(),
 'begin-stars':async()=>beginReading('starred'),
 restart:async b=>beginReading(b.dataset.mode||'all',true),
 'open-reading':async()=>{
  let next=openReading(state);
  if(!next.session.reading.choices.length)next=submitReading(next);
  if(await save(next))render();
 },
 choose:async b=>{
  const next=submitReading(state,b.dataset.choice);
  if(await save(next)){render();if(next.session.reading.rating==='choice_correct')celebrateReading();$('#reading-result')?.focus({preventScroll:true});$('#reading-result')?.scrollIntoView({block:'nearest'});}
 },
 'read-only':async()=>{const next=submitReading(state);if(await save(next)){render();$('#reading-result')?.focus({preventScroll:true});$('#reading-result')?.scrollIntoView({block:'nearest'});}},
 'next-reading':async()=>{if(await save(nextReading(state))){render();window.scrollTo(0,0);}},
 star:async b=>{
   const id=b.dataset.id,position=window.scrollY;
   if(await save(toggleStar(state,id))){render();window.scrollTo(0,position);document.querySelector(`button[data-action="star"][data-id="${id}"]`)?.focus({preventScroll:true});}
 },
 finish:async()=>{const next=structuredClone(state);next.session=null;if(await save(next)){location.hash='home';render();}},
 edit:async b=>openEditor(b.dataset.id),
 'close-modal':async()=>$('#modal').close(),
 delete:async b=>{
  const card=state.cards.find(c=>c.card_id===b.dataset.id);
  if(!confirm(`「${card.keyword}」と、この単語の学習履歴を削除しますか？ 元のExcelは変更されません。`))return;
  const next=structuredClone(state);next.cards=next.cards.filter(c=>c.card_id!==card.card_id);delete next.progress[card.card_id];if(next.stars)delete next.stars[card.card_id];next.history=next.history.filter(h=>h.card_id!==card.card_id);
  if(next.session?.queue.includes(card.card_id))next.session=null;
  if(await save(next,'単語と履歴を削除しました。')){$('#modal').close();render();}
 },
 page:async b=>{page+=Number(b.dataset.delta);render();window.scrollTo(0,0);},
 import:async()=>{
  if(importData.revision!==state.revision){selectSheet(importData.index);render();notify('保存内容が変わったため、重複候補を再確認してください。',true);return;}
  const {next,counts}=applyImport(state,importData.plan,importData.source);
  next.importLog[0].errors=structuredClone(importData.prepared.errors);
  if(await save(next,`追加${counts.added}枚・更新${counts.updated}枚・スキップ${counts.skipped}枚。学習履歴は保持しました。`)){importData=null;render();}
 },
 'cancel-import':async()=>{importData=null;render();},
 'duplicates-add':async()=>{importData.plan.filter(p=>p.candidates.length).forEach(p=>p.action='add');render();},
 'duplicates-skip':async()=>{importData.plan.filter(p=>p.candidates.length).forEach(p=>p.action='skip');render();},
 export:async b=>{
  if(!state.cards.length){notify('出力する単語がありません。');return;}
  const fmt=b.dataset.format;
  const blob=fmt==='xlsx'?await exportXlsx(state.cards):new Blob([toDelimited(state.cards,fmt==='tsv'?'\t':',')],{type:'text/'+(fmt==='tsv'?'tab-separated-values':'csv')+';charset=utf-8'});
  download(blob,`マイマイ_AP単語帳_${dayJST()}.${fmt}`);notify('ダウンロードを開始しました。保存先をご確認ください。');
 },
 backup:async()=>{download(new Blob([JSON.stringify({format:'maimai-ap-backup',version:2,exported_at:new Date().toISOString(),state},null,2)],{type:'application/json'}),`マイマイ_APバックアップ_${dayJST()}.json`);notify('バックアップのダウンロードを開始しました。');},
 restore:async()=>{const {next,added,skipped}=mergeBackup(state,restoreData);if(await save(next,`${added}枚と履歴を復元しました。同一データ${skipped}枚はそのまま保持しました。`)){restoreData=null;render();}},
 'cancel-restore':async()=>{restoreData=null;render();}
};
document.addEventListener('click',async e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled||busy)return;
 try{await actions[b.dataset.action]?.(b);}catch(error){notify(error.message,true);}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 try{
  if(t.id==='import-file'&&t.files[0])await loadImport(t.files[0],$('#encoding').value);
  if(t.id==='sheet-select'){selectSheet(Number(t.value));render();}
  if(t.dataset.plan){importData.plan[Number(t.dataset.plan)].action=t.value;$('#plan-count').textContent=planCount();}
  if(t.dataset.target)importData.plan[Number(t.dataset.target)].target=t.value;
  if(['source-filter','category-filter','status-filter'].includes(t.id)){filters[t.id.split('-')[0]]=t.value;page=0;render();}
  if(t.id==='restore-file'&&t.files[0]){
   if(t.files[0].size>20*1024*1024)throw Error('バックアップは20MB以下にしてください。');
   const incoming=validateBackup(JSON.parse(await t.files[0].text()));mergeBackup(state,incoming);restoreData=incoming;importData=null;render();
  }
 }catch(error){notify(error.message,true);}
});
function searchInput(e){
 if(e.target.id==='search'&&!e.isComposing){
  const pos=e.target.selectionStart;filters.q=e.target.value;page=0;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);
 }
}
document.addEventListener('input',searchInput);
document.addEventListener('compositionend',searchInput);
document.addEventListener('submit',async e=>{
 if(e.target.id!=='edit-form')return;e.preventDefault();if(busy)return;
 try{
  const form=e.target,id=form.dataset.id,values=Object.fromEntries(FIELDS.map(k=>[k,String(new FormData(form).get(k)||'').trim()]));
  if(!values.cue_text||!values.keyword){notify('「何の話？」とキーワードを入力してください。',true);return;}
  const next=structuredClone(state),now=new Date().toISOString(),old=next.cards.find(c=>c.card_id===id);
  if(id&&!old)throw Error('このカードは別のタブで削除されました。');
  if(old)Object.assign(old,values,{updated_at:now});
  else{const card_id=crypto.randomUUID();next.cards.push({...values,card_id,created_at:now,updated_at:now});next.progress[card_id]=initialProgress();}
  if(await save(next,'単語を保存しました。')){$('#modal').close();render();}
 }catch(error){notify(error.message,true);}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
channel?.addEventListener('message',async()=>{
 if(busy)return;
 try{state=upgradeState(await readState(db));$('#modal').close();render();notify('別のタブの変更を反映しました。');}catch(e){notify(e.message,true);}
});
document.addEventListener('visibilitychange',async()=>{
 if(!document.hidden&&!busy){try{const latest=await readState(db);if(latest&&latest.revision!==state.revision){state=upgradeState(latest);$('#modal').close();render();}}catch{}}
});
try{db=await openDB();state=upgradeState(await readState(db));setStatus(state.revision?'このブラウザに保存済み':'このブラウザに保存');render();}
catch(e){setStatus('保存機能を利用できません',true);$('#main').innerHTML='<div class="error-box">ブラウザの保存機能を開けませんでした。通常モードのブラウザで開き直してください。学習操作は開始していません。</div>';}

})();</script></body>
